schema: spec-driven

context: |
  Pen — личное Android-приложение для рукописного ввода стилусом (заметки, PDF, доска, рисование).
  Полный проектный документ: docs/design.md.
  Устройство: Xiaomi Pad 7 (HyperOS 2 / Android 15, 3200x2136, 144 Гц) + Xiaomi Focus Pen.
  Только для себя: без Google Play, установка через adb, minSdk = targetSdk = 35.
  Стек: Kotlin 2.0.21, Jetpack Compose, AGP 8.7.2, Gradle 8.10.2, JDK 17, version catalog, androidx.ink,
  androidx.graphics (front-buffered rendering), androidx.input motion prediction.
  Пакет com.zzzudroid.pen, один модуль app. Соглашения — как в соседних проектах
  c:\Projects\Personal\VoiceTimer и moibabki-android (BuildConfig с BUILD_TIME/GIT_HASH/GIT_DIRTY,
  keystore.properties для release, dist/ для бэкапов APK, CHANGELOG.md).
  Доступ с ПК: открытая папка Documents/Pen + автоэкспорт PDF; Syncthing — только возможность на будущее, не реализуем.
  Разработка ведётся и на Windows, и на Linux: всё машинно-зависимое — только в local.properties.
  Комментарии в коде — на русском.
  В экране «О программе» всегда показывать версию и время сборки (генерируется Gradle).
  Решения по вводу пера принимаются по реальным данным с устройства (диагностический экран, logcat), не по догадкам.

rules:
  proposal:
    - Описание и обоснование — на русском языке
  tasks:
    - Каждая задача заканчивается проверяемым результатом на устройстве или сборкой
